<div class="reader-controls" role="group" aria-label="Mipangilio ya kusoma">
  <span>Ukubwa wa maandishi</span>
  <button type="button" data-reader-size="-1" aria-label="Punguza maandishi" aria-controls="reading-content">A−</button>
  <output data-reader-size-output aria-live="polite">19px</output>
  <button type="button" data-reader-size="1" aria-label="Ongeza maandishi" aria-controls="reading-content">A+</button>
  <button type="button" onclick="toggleDark()" data-theme-toggle aria-pressed="false" aria-label="Badilisha mada ya kusoma">Mwangaza / Giza</button>
</div>
