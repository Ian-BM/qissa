{% load static %}
<a href="{% url 'short_detail' short.slug %}" class="short-card">
  <div class="short-card__cover">
    {% if short.cover_image %}
      <img src="{{ short.cover_image.url }}" alt="{{ short.title }}" loading="lazy">
    {% else %}
      <div class="short-card__placeholder">{{ short.category_emoji }}</div>
    {% endif %}
  </div>
  <div class="short-card__body">
    <h3 class="short-card__title">{{ short.title }}</h3>
    <div class="short-card__meta">
      <span>⚡ {{ short.read_time }} min</span>
      <span>❤️ {{ short.likes }}</span>
      <span>👁 {{ short.views }}</span>
    </div>
  </div>
</a>
