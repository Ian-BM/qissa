{% extends "base.html" %}

{% block title %}Jisajili — Qissa{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <span class="brand"><span class="brand-dot"></span>Qissa</span>
    <h1>Jiunge na Qissa</h1>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="text" name="name" placeholder="Jina kamili" value="{{ name }}" required>
      <input type="tel" name="phone" placeholder="Namba ya simu" value="{{ phone }}" required inputmode="numeric" pattern="^0\d{8,12}$">
      <button type="submit" class="btn btn-rose btn-block">Jisajili</button>
    </form>

    <span class="switch-link">Una akaunti? <a href="{% url 'login' %}">Ingia</a></span>
    <p class="auth-note">Akaunti ya bure. Malipo ya Premium peke yake.</p>
  </div>
</div>
{% endblock %}
