{% extends "base.html" %}

{% block title %}Ingia — Qissa{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <span class="brand"><span class="brand-dot"></span>Qissa</span>
    <h1>Karibu tena</h1>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="tel" name="phone" placeholder="Namba ya simu" value="{{ phone }}" required inputmode="numeric" pattern="^0\d{8,12}$">
      <button type="submit" class="btn btn-rose btn-block">Ingia</button>
    </form>

    <span class="switch-link">Huna akaunti? <a href="{% url 'register' %}">Jisajili</a></span>
  </div>
</div>
{% endblock %}
