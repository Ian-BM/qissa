{% extends "base.html" %}
{% load static %}

{% block title %}Ingia — Qissa{% endblock %}


{% block content %}
<div class="auth-shell flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <a href="{% url 'home' %}" class="inline-block">
        {% include "partials/brand.html" %}
      </a>
      <h1 class="text-xl font-bold text-ink dark:text-ink mt-5 mb-1">Karibu tena</h1>
      <p class="text-sm text-muted dark:text-muted">Ingia uendelee kusoma hadithi zako</p>
    </div>
    <div class="auth-card bg-surface dark:bg-surface border border-line dark:border-line rounded-2xl p-6 shadow-sm">
      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label for="auth-phone" class="block text-sm font-medium text-ink dark:text-muted mb-1.5">Namba ya simu</label>
          <input type="tel" id="auth-phone" name="phone" autocomplete="tel" required placeholder="0712 345 678" value="{{ phone }}" {% if error %}aria-invalid="true" aria-describedby="auth-error"{% endif %}
            inputmode="numeric" pattern="^0\d{8,12}$">
        </div>
        {% if error %}
          <div id="auth-error" role="alert" class="px-3.5 py-2.5 bg-soft dark:bg-accent-soft border border-line dark:border-line rounded-lg text-sm text-danger dark:text-danger">
            {{ error }}
          </div>
        {% endif %}
        <button type="submit"
          class="w-full bg-ink hover:bg-action-hover dark:hover:bg-action-hover font-semibold py-2.5 rounded-lg transition-colors text-sm text-on-ink">
          Ingia
        </button>
      </form>
    </div>
    <p class="text-center text-sm text-muted dark:text-muted mt-5">
      Huna akaunti?
      <a href="{% url 'register' %}" class="text-accent dark:text-accent font-medium hover:underline">Jisajili bure</a>
    </p>
  </div>
</div>
{% endblock %}
